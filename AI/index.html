<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek V4 Pro AI 助手</title>
    <!-- 基础图标 -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <!-- 苹果设备适配 -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <!-- 安卓设备适配 -->
    <link rel="manifest" href="site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f0f2f5;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-container {
            height: 600px;
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .message {
            margin-bottom: 18px;
            padding: 12px 18px;
            border-radius: 10px;
            max-width: 75%;
            line-height: 1.6;
        }
        .user {
            background: #0095f6;
            color: white;
            margin-left: auto;
        }
        .ai {
            background: #e5e5ea;
            color: #333;
            margin-right: auto;
            white-space: pre-wrap;
        }
        .input-area {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        #input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        #input:focus {
            border-color: #0095f6;
        }
        #send {
            padding: 15px 25px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        #send:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .loading {
            color: #666;
            font-style: italic;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chat"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="向 DeepSeek V3.2 提问..." autocomplete="off">
        <button id="send">发送</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        let messages = [];

        // ========== 内置配置 在这里改 ==========
        const API_KEY = "sk-KZ6oMvP74DhyDmXID6FzrrBZ21xnm4O5rlwKGbCVQ4mXWPs2";
        const API_URL = "https://ai.luogu.me/v1/chat/completions";
        const MODEL_NAME = "deepseek-v4-pro";
        // =======================================

        send.addEventListener('click', sendMessage);
        input.addEventListener('keydown', e => e.key === 'Enter' && sendMessage());

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            send.disabled = true;
            messages.push({ role: 'user', content: text });

            const loading = addLoading();

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: messages,
                        temperature: 0.7
                    })
                });

                const data = await res.json();
                chat.removeChild(loading);

                if (data.error) {
                    addMessage(`错误：${data.error.message}`, 'ai');
                    return;
                }

                const reply = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: reply });
                addMessage(reply, 'ai');

            } catch (err) {
                chat.removeChild(loading);
                addMessage('请求失败，请稍后重试', 'ai');
                console.error(err);
            }

            send.disabled = false;
        }

        function addMessage(text, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addLoading() {
            const div = document.createElement('div');
            div.className = 'loading';
            div.textContent = 'DeepSeek V3.2 思考中...';
            chat.appendChild(div);
            return div;
        }
    </script>
</body>
</html>
